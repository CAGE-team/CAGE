kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        audit-log-path: /var/log/kubernetes/audit.log
        audit-policy-file: /etc/kubernetes/audit-policy.yaml
        audit-log-maxage: "7"
        audit-log-maxbackup: "3"
        audit-log-maxsize: "100"
      extraVolumes:
      - name: audit-policy
        hostPath: /etc/kubernetes/audit-policy.yaml
        mountPath: /etc/kubernetes/audit-policy.yaml
        readOnly: true
      - name: audit-logs
        hostPath: /var/log/kubernetes
        mountPath: /var/log/kubernetes
        readOnly: false
  # kind requires an absolute host path here -- there is no portable way to
  # express "this repo's audit-policy.yaml" across different machines/users
  # directly in this file. Do NOT hardcode your own machine's absolute path
  # (a previous version hardcoded one contributor's WSL home directory,
  # which broke cluster creation for everyone else). Instead, always create
  # this cluster via `restart_cage.sh` (repo root), which copies
  # audit-policy.yaml to a fresh scratch path and substitutes the
  # placeholder below for the real, current, machine-local path
  # automatically. If you must run `kind create cluster --config
  # kind-config.yaml` directly, replace the placeholder below with an
  # absolute path to your own checkout's audit-policy.yaml first.
  extraMounts:
  - hostPath: __AUDIT_POLICY_HOSTPATH_PLACEHOLDER__
    containerPath: /etc/kubernetes/audit-policy.yaml
    readOnly: true
- role: worker
- role: worker
